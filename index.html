<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letterboxd Clone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="first">
      <!-- Top Navigation Bar -->
      <div class="second">
        <div class="logo">
          <img src="logo.svg" alt="Letterboxd Logo" />
        </div>
        <div class="navbar">
          <ul>
            <li><a href="#">Sign In</a></li>
            <li><a href="#">Create Account</a></li>
            <li><a href="#">Films</a></li>
            <li><a href="#">Lists</a></li>
            <li><a href="#">Members</a></li>
            <li><a href="#">Journal</a></li>
          </ul>
        </div>
      </div>

      <!-- Center Hero Content -->
      <div class="info">
        <h1>Track films you’ve watched.<br>
        Save those you want to see.<br>
        Tell your friends what’s good.</h1>
        <button class="cta-btn">Get started — it's free!</button>
      </div>
    </div>
  </body>
</html>
